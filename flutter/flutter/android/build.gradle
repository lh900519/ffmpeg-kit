buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()

        flatDir {
            // dirs project(':xiaohongshu_kit').file('libs'), project(':xiaohongshu_kit').file('xhs-share-sdk')
            dirs project(':ffmpeg_kit_flutter_min_gpl').file('libs')
            // dirs project(':xiaohongshu_kit').file('xhs-share-sdk')
        }
    }
}

apply plugin: 'com.android.library'

android {
    // Conditional for compatibility with AGP <4.2.
    if (project.android.hasProperty("namespace")) {
        namespace 'com.arthenica.ffmpegkit.flutter'
    }

    compileSdkVersion 33

    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 33
        versionCode 603
        versionName "6.0.3"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    lintOptions {
        disable 'GradleCompatible'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.5.0'

    //start:ffmpeg-kit-https
    // implementation 'com.arthenica:ffmpeg-kit-https:6.0-2'
    // FmpegKit has been officially retired.Place dependent libraries locally
    // The Maven configuration is immutable and currently not required; it’s retained solely as a precaution.
    // implementation files('./libs/ffmpeg-kit-https-6.0-2.aar')
    // implementation files('./libs/smart-exception-java-0.2.1.jar')
    // implementation files('./libs/smart-exception-common-0.2.1.jar')

    // implementation(name: 'ffmpeg-kit-https-6.0-2', ext: 'aar')
    // // https://github.com/NooruddinLakhani/ffmpeg-kit-full-gpl/releases/download/v1.0.0/ffmpeg-kit-full-gpl.aar
    // implementation(name: 'ffmpeg-kit-full-gpl', ext: 'aar')
    implementation(name: 'ffmpeg-kit-min-gpl-6.0-2.LTS', ext: 'aar')
    implementation(name: 'smart-exception-java-0.2.1', ext: 'jar')
    implementation(name: 'smart-exception-common-0.2.1', ext: 'jar')
}
